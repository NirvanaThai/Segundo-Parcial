<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="EstiloBoton.css">
    <title>Document</title>
</head>
<body>

    <nav class="barra">
        <a href="index.html">Regresar al inicio</a>
    </nav>

    <script>
        let N1 = Number(prompt("Ingresa Numero 1:"));
        let N2 = Number(prompt("Ingresa Numero 2:"));
        let Op = Number(prompt("1.Suma 2.Resta 3.Multiplicacion 4.Division"));
        switch(Op){
            case 1:
               Result = N1 + N2;
               document.write("Resultado: " + Result);
               break;
            case 2:
                Result = N1 - N2;
                document.write("Resultado: " + Result)
                break;
            case 3:
                Result = N1 * N2;
                document.write("Resultado: " + Result);
                break;
            case 4:
                Result = N1 / N2;
                document.write("Resultado: " + Result);
                break;
            default:
                document.write("Opcion invalida");
        }
    </script>
</body>
</html>
