<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document</title>
</head>
<body>

    <nav class="barra">
        <a href="index.html">Regresar al inicio</a>
    </nav>

    <h1>Suma</h1>
    <script>
        let N1 = Number(prompt('Introduce el primer numero:'));
        let N2 = Number(prompt('Introduce el segundo numero:'));
        Suma =  N1 + N2;
        document.write("Suma es:" + Suma);
        Resta = N1 - N2;
        document.write("\n Resta es:" + Resta);
        Multi = N1 * N2;
        document.write("\n Multiplicacion es:" + Multi);
        Div = N1 / N2;
        document.write("\n Division:" + Div);
    </script>
</body>
</html>
