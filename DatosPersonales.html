    <script>
          let continua=confirm("Desea agregar datos?");
          if(continua){
          let nombre=(prompt("Ingresa tu nombre"));
          let edad=Number(prompt("Ingresa tu eddad"));
          let especialidad=String(prompt("Ingresa tu especialidad"));
          let correo=String(prompt("Ingresa tu correo electronico"));
          
            document.write("Tu nombre es : "+nombre);
            document.write("Tu edad es : "+edad);
            document.write("Tu especialidad es : "+especialidad);
            document.write("Tu correo es: "+correo);
          }else{
            alert("Tengo flojera");
          }
    </script>
